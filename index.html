<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bornes Polytech Lille</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#000;font-family:'Inter',sans-serif;color:#f1f5f9;display:flex;flex-direction:column;align-items:center;padding:32px 16px 56px}
  .header{text-align:center;margin-bottom:28px}
  .label{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#475569;margin-bottom:8px}
  h1{font-size:26px;font-weight:800;color:#fff;letter-spacing:-0.5px}
  .stats{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;font-size:13px}
  .stat-libre{color:#4ade80;font-weight:700}
  .stat-occupe{color:#fb923c;font-weight:700}
  .stat-alarm{color:#f87171;font-weight:700}
  .stat-resa{color:#a5b4fc;font-weight:700}
  .conn{margin-top:8px;font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:400px}
  .borne{border-radius:18px;padding:16px;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform 0.12s}
  .borne:active{transform:scale(0.97)}
  .borne.selected{outline:2px solid #60a5fa;outline-offset:2px}
  .borne.libre{background:#0a1a0f;border:1.5px solid #16a34a}
  .borne.occupe{background:#1a0e00;border:1.5px solid #c2410c}
  @keyframes occupe-flash{0%,100%{background:#1a0e00;border-color:#c2410c;box-shadow:0 0 12px #f9731620}50%{background:#2a1500;border-color:#fb923c;box-shadow:0 0 28px #fb923c50}}
  .borne.occupe{animation:occupe-flash 2s ease-in-out infinite}
  .borne.hors-service{background:#111;border:1.5px solid #334155;cursor:default;opacity:0.85}
  @keyframes stripes{0%{background-position:0 0}100%{background-position:28px 0}}
  .hs-stripes{margin:10px 0 4px;height:6px;border-radius:4px;background:repeating-linear-gradient(90deg,#1e293b 0px,#1e293b 10px,#0f172a 10px,#0f172a 18px);background-size:28px 100%;animation:stripes 1.2s linear infinite;opacity:0.7}
  @keyframes wrench{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
  .hs-icon{font-size:18px;display:inline-block;animation:wrench 1.4s ease-in-out infinite;margin:8px 0 2px}
  @keyframes hs-pulse{0%,100%{opacity:0.5}50%{opacity:0.9}}
  .hs-label{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:1px;animation:hs-pulse 2s ease-in-out infinite}
  @keyframes alarm-bg{0%,100%{background:#1a0000;border-color:#ef4444;box-shadow:0 0 28px #ef444440}50%{background:#2a0000;border-color:#fca5a5;box-shadow:0 0 48px #ef444470}}
  .borne.alarme{animation:alarm-bg 1s ease-in-out infinite;cursor:pointer}
  @keyframes signale-bg{
    0%,100%{background:#1a0010;border-color:#db2777;box-shadow:0 0 24px #db277740}
    33%{background:#2d0020;border-color:#f472b6;box-shadow:0 0 48px #f472b670}
    66%{background:#1a0010;border-color:#ec4899;box-shadow:0 0 36px #ec489950}
  }
  .borne.signale{animation:signale-bg 0.8s ease-in-out infinite;cursor:pointer}
  .borne.signale .dot{background:#f472b6}
  .borne.signale .dot-ring{background:#f472b6;animation:pulse-ring 0.5s ease-out infinite}
  .borne.signale .borne-status{color:#f9a8d4}
  .btn-charge-terminee{width:100%;margin-top:8px;padding:8px;border-radius:10px;border:1px solid #db2777;background:#1a0010;color:#f472b6;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
  .btn-charge-terminee:active{background:#2d0020}
  .civisme-rose{margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:#1a0010;border:1px solid #db277750;text-align:center}
  .civisme-rose-text{font-size:11px;color:#f9a8d4;font-weight:600;font-style:italic}
  @keyframes resa-bg{0%,100%{background:#0c0a1f;border-color:#4f46e5;box-shadow:0 0 20px #4f46e530}50%{background:#131040;border-color:#a5b4fc;box-shadow:0 0 36px #818cf850}}
  .borne.reservee{animation:resa-bg 2s ease-in-out infinite;cursor:pointer}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:0.25}}
  .borne.flash{animation:flash 0.35s ease}
  .dot-wrap{position:relative;width:12px;height:12px;flex-shrink:0;margin-top:3px}
  .dot,.dot-ring{width:12px;height:12px;border-radius:50%;position:absolute;top:0;left:0}
  .libre .dot{background:#4ade80}.occupe .dot{background:#fb923c}.alarme .dot{background:#f87171}.reservee .dot{background:#a5b4fc}.hors-service .dot{background:#475569}
  @keyframes pulse-ring{0%{transform:scale(1);opacity:0.7}100%{transform:scale(2.6);opacity:0}}
  .libre .dot-ring{background:#4ade80;animation:pulse-ring 2s ease-out infinite}
  .occupe .dot-ring{background:#fb923c;animation:pulse-ring 1.2s ease-out infinite}
  .alarme .dot-ring{background:#f87171;animation:pulse-ring 0.6s ease-out infinite}
  .reservee .dot-ring{background:#a5b4fc;animation:pulse-ring 1.5s ease-out infinite}
  .borne-top{display:flex;justify-content:space-between;align-items:flex-start}
  .borne-id{font-size:24px;font-weight:800;color:#fff;line-height:1}
  .borne-status{font-size:12px;margin-top:5px;font-weight:600}
  .libre .borne-status{color:#86efac}.occupe .borne-status{color:#fdba74}.alarme .borne-status{color:#fca5a5}.reservee .borne-status{color:#c7d2fe}.hors-service .borne-status{color:#64748b}
  .alarm-banner{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 4px;padding:8px 10px;border-radius:10px;background:#450a0a;border:1px solid #ef444460}
  @keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .alarm-icon{font-size:16px;animation:shake 0.5s ease-in-out infinite;display:inline-block}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
  .alarm-text{font-size:12px;font-weight:800;color:#fca5a5;text-transform:uppercase;letter-spacing:0.8px;animation:blink 0.9s ease-in-out infinite}
  .resa-box{margin:10px 0 4px;padding:9px 11px;border-radius:10px;background:#1e1b4b;border:1px solid #4f46e5}
  .resa-name{font-size:15px;font-weight:800;color:#e0e7ff}
  .resa-timer{font-size:12px;color:#a5b4fc;margin-top:4px;font-weight:600}
  .resa-timer.urgent{color:#f87171}
  .btn-reserver{width:100%;margin-top:10px;padding:8px;border-radius:10px;border:1px solid #4338ca;background:#1e1b4b;color:#c7d2fe;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
  .btn-reserver:active{background:#312e81}
  .btn-sans-appli{width:100%;margin-top:6px;padding:7px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
  .btn-sans-appli:active{background:#334155}
  .btn-debrancher{width:100%;margin-top:6px;padding:7px;border-radius:10px;border:1px solid #f97316;background:#1a0e00;color:#fb923c;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
  .btn-debrancher:active{background:#2a1500}
  .civisme-box{margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:#1a1200;border:1px solid #854d0e;text-align:center}
  .civisme-text{font-size:11px;color:#fbbf24;font-weight:600;font-style:italic}
  @keyframes zap{0%,100%{opacity:0.15;transform:scaleY(0.8)}50%{opacity:1;transform:scaleY(1.1);filter:drop-shadow(0 0 5px #fb923c)}}
  .lightning-wrap{display:flex;justify-content:center;align-items:center;margin:10px 0 4px;height:28px}
  .lightning{font-size:22px;animation:zap 0.9s ease-in-out infinite;display:inline-block}
  .lightning:nth-child(2){animation-delay:0.3s;font-size:17px}
  .lightning:nth-child(3){animation-delay:0.6s;font-size:13px}
  .progress-wrap{margin-top:8px;background:#ffffff15;border-radius:6px;height:5px;overflow:hidden}
  .progress-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,#f97316,#fbbf24);box-shadow:0 0 6px #f9731660}
  .fin-box{margin-top:8px}
  .fin-label{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px}
  .fin-heure{font-size:17px;font-weight:800;color:#fdba74;margin-top:3px;line-height:1}
  .fin-min{font-size:11px;color:#78716c;margin-left:5px;font-weight:500}
  .borne-actions{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
  .hs-btn{font-size:9px;cursor:pointer;text-decoration:underline;color:#334155;background:none;border:none;font-family:inherit;padding:0}
  .borne.hors-service .hs-btn{color:#4ade8055}
  .tap-hint{font-size:9px;font-weight:600}
  .libre .tap-hint{color:#4ade8040}.occupe .tap-hint{color:#fb923c50}.alarme .tap-hint{color:#f8717160}.reservee .tap-hint{color:#a5b4fc60}
  @keyframes sparkle{0%,100%{opacity:0;transform:scale(0.4) rotate(0deg)}50%{opacity:0.8;transform:scale(1) rotate(180deg)}}
  .sparkle{position:absolute;font-size:8px;animation:sparkle 3s ease-in-out infinite;pointer-events:none;color:#4ade80}
  .sparkle:nth-child(1){top:8px;right:18px;animation-delay:0s}
  .sparkle:nth-child(2){top:22px;right:10px;animation-delay:1s;font-size:6px}
  .sparkle:nth-child(3){top:14px;right:28px;animation-delay:2s;font-size:5px}
  .panel{margin-top:20px;background:#0f172a;border:1.5px solid #1e3a5f;border-radius:20px;padding:22px;width:100%;max-width:400px;display:none;box-shadow:0 8px 40px #000a}
  .panel.visible{display:block}
  .panel-title{font-size:14px;color:#93c5fd;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  input[type=time]{width:100%;padding:14px;border-radius:12px;border:1.5px solid #1e3a5f;background:#020617;color:#fff;font-size:28px;text-align:center;outline:none;font-weight:800;font-family:inherit;letter-spacing:3px}
  input[type=text]{width:100%;padding:14px;border-radius:12px;border:1.5px solid #312e81;background:#020617;color:#e0e7ff;font-size:20px;text-align:center;outline:none;font-weight:700;font-family:inherit}
  input[type=text]::placeholder{color:#334155;font-weight:400}
  .btn-row{display:flex;gap:10px;margin-top:14px}
  .btn-confirm{flex:1;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#ea580c,#f97316);color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
  .btn-confirm:disabled{opacity:0.4}
  .btn-confirm.blue{background:linear-gradient(135deg,#4338ca,#818cf8)}
  .btn-cancel{flex:1;padding:14px;border-radius:12px;border:1.5px solid #1e293b;background:transparent;color:#64748b;font-size:14px;cursor:pointer;font-family:inherit}
  .footer{margin-top:18px;font-size:10px;color:#1e293b;text-align:center;line-height:2}
  .btn-reset{margin-top:24px;padding:11px 28px;border-radius:50px;border:1px solid #334155;background:transparent;color:#475569;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s}
  .btn-reset:active{background:#1e293b;color:#94a3b8}
</style>
</head>
<body>
<div class="header">
  <div class="label">Polytech Lille</div>
  <h1>⚡ Bornes de recharge</h1>
  <div class="stats">
    <span class="stat-libre" id="stat-libres">● 6 libres</span>
    <span class="stat-occupe" id="stat-occupees" style="display:none">● 0 en charge</span>
    <span class="stat-alarm" id="stat-alarmes" style="display:none">● 0 ⚠</span>
    <span class="stat-resa" id="stat-resas" style="display:none">● 0 réservée</span>
  </div>
  <div class="conn" id="conn-status" style="color:#334155">Connexion…</div>
</div>

<div class="grid" id="grid"></div>

<div class="panel" id="panel-charge">
  <div class="panel-title">🔌 <span id="panel-charge-title">Borne — Heure de fin</span></div>
  <input type="time" id="time-input"/>
  <div class="btn-row">
    <button class="btn-confirm" id="btn-confirm">⚡ Confirmer</button>
    <button class="btn-cancel" id="btn-cancel-charge">Annuler</button>
  </div>
</div>

<div class="panel" id="panel-resa">
  <div class="panel-title">🔵 <span id="panel-resa-title">Réserver la borne</span></div>
  <input type="text" id="prenom-input" placeholder="Votre prénom…" maxlength="20"/>
  <div class="btn-row">
    <button class="btn-confirm blue" id="btn-confirm-resa">Réserver 10 min</button>
    <button class="btn-cancel" id="btn-cancel-resa">Annuler</button>
  </div>
</div>

<div class="footer">sync auto 15s</div>
<button class="btn-reset" id="btn-reset">Remettre toutes les bornes en disponible</button>

<script>
const BORNES=["B1","B2","B3","B4","B5","B6"];
const API="/api/bornes";
const POLL=15000;
const RESA_DURATION=10*60*1000;
let state=Object.fromEntries(BORNES.map(id=>[id,{status:"libre",fin:null,resa:null,resaFin:null}]));
let selectedCharge=null,selectedResa=null;

async function apiRead(){const r=await fetch(API);if(!r.ok)throw new Error();return r.json();}
async function apiWrite(s){const r=await fetch(API,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)});if(!r.ok)throw new Error();}

function fmtH(iso){if(!iso)return"";return new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
function fmtMin(iso){if(!iso)return null;return Math.round((new Date(iso)-Date.now())/60000);}
function fmtSec(iso){if(!iso)return null;return Math.round((new Date(iso)-Date.now())/1000);}
function isAlarme(b){return b.status==="occupe"&&b.fin&&new Date(b.fin)<Date.now();}
function isSignale(b){return b.status==="signale";}
function isResaExpired(b){return b.status==="reservee"&&b.resaFin&&new Date(b.resaFin)<Date.now();}
function progress(fin){if(!fin)return 0;const t=4*3600*1000,e=t-(new Date(fin)-Date.now());return Math.min(100,Math.max(0,Math.round(e/t*100)));}

function checkExpiries(){
  let changed=false;const next={...state};
  BORNES.forEach(id=>{if(isResaExpired(next[id])){next[id]={status:"libre",fin:null,resa:null,resaFin:null};changed=true;}});
  if(changed)saveState(next);
}

function setConn(s,t){
  const el=document.getElementById("conn-status");
  if(s==="ok"){el.style.color="#4ade8055";el.textContent=`✓ ${t}`;}
  else if(s==="error"){el.style.color="#f87171";el.textContent="⚠ Erreur réseau";}
  else{el.style.color="#334155";el.textContent="Connexion…";}
}

function render(){
  checkExpiries();
  const grid=document.getElementById("grid");grid.innerHTML="";
  let libres=0,occupees=0,alarmes=0,resas=0;
  BORNES.forEach(id=>{
    const b=state[id];
    const alarme=isAlarme(b),reservee=b.status==="reservee",signale=isSignale(b);
    if(b.status==="libre")libres++;
    else if(b.status==="occupe"&&!alarme)occupees++;
    else if(alarme)alarmes++;
    else if(reservee)resas++;
    const min=fmtMin(b.fin),pct=progress(b.fin);
    const resaSec=fmtSec(b.resaFin),resaMin=fmtMin(b.resaFin);
    const cardClass=alarme?"alarme":signale?"signale":reservee?"reservee":b.status;
    const div=document.createElement("div");
    div.className=`borne ${cardClass}${selectedCharge===id?" selected":""}`;
    let html=`<div class="borne-top"><div>
      <div class="borne-id">${id}</div>
      <div class="borne-status">${alarme?"Charge terminée":signale?"Charge terminée !":reservee?"Réservée":b.status==="libre"?"Disponible":b.status==="occupe"?"En charge":"Hors service"}</div>
    </div><div class="dot-wrap"><div class="dot-ring"></div><div class="dot"></div></div></div>`;
    if(b.status==="libre"){html+=`<span class="sparkle">✦</span><span class="sparkle">✦</span><span class="sparkle">✦</span>`;}
    if(b.status==="hors-service"){html+=`<div style="text-align:center;padding:6px 0"><div class="hs-stripes"></div><div class="hs-icon">🔧</div><div class="hs-label">Hors service</div></div>`;}
    if(alarme){
      html+=`<div class="alarm-banner"><span class="alarm-icon">🔔</span><span class="alarm-text">Débranchez SVP !</span></div>`;
      html+=`<div class="civisme-box"><div class="civisme-text">On partage les bornes — libérez votre place 🙏</div></div>`;
      html+=`<button class="btn-debrancher" data-id="${id}">🔌 Débrancher SVP</button>`;
    } else if(signale){
      html+=`<div class="civisme-rose"><div class="civisme-rose-text">Merci de libérer la borne — vos collègues attendent !</div></div>`;
      html+=`<button class="btn-debrancher" data-id="${id}">🔌 Débrancher SVP</button>`;
    } else if(reservee){
      const urgent=resaSec!==null&&resaSec<120;
      html+=`<div class="resa-box"><div class="resa-name">👤 ${b.resa||"?"}</div><div class="resa-timer${urgent?" urgent":""}">⏱ Expire dans ${resaMin>0?`${resaMin} min`:"< 1 min"}</div></div>`;
    } else if(b.status==="occupe"){
      html+=`<div class="lightning-wrap"><span class="lightning">⚡</span><span class="lightning">⚡</span><span class="lightning">⚡</span></div>`;
      if(b.fin){html+=`<div class="fin-box"><div class="fin-label">Fin estimée</div><div class="fin-heure">${fmtH(b.fin)}${min>0?`<span class="fin-min">${min} min</span>`:""}</div></div><div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;}
      html+=`<button class="btn-charge-terminee" data-id="${id}">⚠ Charge terminée</button>`;
    }
    if(b.status!=="hors-service"&&!reservee&&!signale){
      html+=`<button class="btn-reserver" data-id="${id}" title="Réserver">🪫</button>`;
    }
    if(b.status==="libre"){
      html+=`<button class="btn-sans-appli" data-id="${id}">Borne occupée</button>`;
    }
    html+=`<div class="borne-actions">
      <button class="hs-btn" data-id="${id}">${b.status==="hors-service"?"✓ Remettre":"Hors service"}</button>
      <span class="tap-hint">${b.status==="libre"?"Tap pour brancher":alarme?"Tap pour libérer":reservee?"Tap — je branche !":b.status==="occupe"?"Tap pour libérer":""}</span>
    </div>`;
    div.innerHTML=html;
    if(b.status!=="hors-service"){
      div.addEventListener("click",e=>{
        if(e.target.classList.contains("hs-btn")||e.target.classList.contains("btn-reserver"))return;
        handleBorne(id);
      });
    }
    div.querySelector(".hs-btn").addEventListener("click",e=>{e.stopPropagation();toggleHS(id);});
    const btnR=div.querySelector(".btn-reserver");
    if(btnR)btnR.addEventListener("click",e=>{e.stopPropagation();openResa(id);});
    const btnSA=div.querySelector(".btn-sans-appli");
    if(btnSA)btnSA.addEventListener("click",e=>{e.stopPropagation();marquerSansAppli(id);});
    const btnD=div.querySelector(".btn-debrancher");
    if(btnD)btnD.addEventListener("click",e=>{e.stopPropagation();saveState({...state,[id]:{status:"libre",fin:null,resa:null,resaFin:null}});});
    const btnCT=div.querySelector(".btn-charge-terminee");
    if(btnCT)btnCT.addEventListener("click",e=>{e.stopPropagation();saveState({...state,[id]:{status:"signale",fin:null,resa:null,resaFin:null}});});
    grid.appendChild(div);
  });
  document.getElementById("stat-libres").textContent=`● ${libres} libre${libres>1?"s":""}`;
  const elO=document.getElementById("stat-occupees");elO.style.display=occupees>0?"":"none";elO.textContent=`● ${occupees} en charge`;
  const elA=document.getElementById("stat-alarmes");elA.style.display=alarmes>0?"":"none";elA.textContent=`● ${alarmes} à débrancher`;
  const elR=document.getElementById("stat-resas");elR.style.display=resas>0?"":"none";elR.textContent=`● ${resas} réservée${resas>1?"s":""}`;
}

function openResa(id){
  selectedResa=id;
  document.getElementById("panel-resa-title").textContent=`Réserver borne ${id}`;
  document.getElementById("prenom-input").value="";
  document.getElementById("panel-charge").classList.remove("visible");
  document.getElementById("panel-resa").classList.add("visible");
  document.getElementById("panel-resa").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function handleBorne(id){
  const b=state[id];
  if(b.status==="occupe"||isAlarme(b)||isSignale(b)){
    saveState({...state,[id]:{status:"libre",fin:null,resa:null,resaFin:null}});
  } else if(b.status==="libre"||b.status==="reservee"){
    selectedCharge=id;
    document.getElementById("panel-charge-title").textContent=`Borne ${id} — Heure de fin`;
    const def=new Date(Date.now()+2*3600*1000);
    document.getElementById("time-input").value=def.toTimeString().slice(0,5);
    document.getElementById("panel-resa").classList.remove("visible");
    document.getElementById("panel-charge").classList.add("visible");
    render();
    document.getElementById("panel-charge").scrollIntoView({behavior:"smooth",block:"nearest"});
  }
}

async function toggleHS(id){
  const b=state[id];
  await saveState({...state,[id]:{status:b.status==="hors-service"?"libre":"hors-service",fin:null,resa:null,resaFin:null}});
}

document.getElementById("btn-confirm").addEventListener("click",async()=>{
  if(!selectedCharge)return;
  const[h,m]=document.getElementById("time-input").value.split(":").map(Number);
  const fin=new Date();fin.setHours(h,m,0,0);if(fin<Date.now())fin.setDate(fin.getDate()+1);
  const btn=document.getElementById("btn-confirm");btn.disabled=true;btn.textContent="Enregistrement…";
  await saveState({...state,[selectedCharge]:{status:"occupe",fin:fin.toISOString(),resa:null,resaFin:null}});
  selectedCharge=null;document.getElementById("panel-charge").classList.remove("visible");
  btn.disabled=false;btn.textContent="⚡ Confirmer";
});
document.getElementById("btn-cancel-charge").addEventListener("click",()=>{selectedCharge=null;document.getElementById("panel-charge").classList.remove("visible");render();});

document.getElementById("btn-confirm-resa").addEventListener("click",async()=>{
  if(!selectedResa)return;
  const prenom=document.getElementById("prenom-input").value.trim();
  if(!prenom){document.getElementById("prenom-input").focus();return;}
  const resaFin=new Date(Date.now()+RESA_DURATION).toISOString();
  const btn=document.getElementById("btn-confirm-resa");btn.disabled=true;btn.textContent="Réservation…";
  const b=state[selectedResa];
  await saveState({...state,[selectedResa]:{...b,resa:prenom,resaFin,status:b.status==="libre"?"reservee":b.status}});
  selectedResa=null;document.getElementById("panel-resa").classList.remove("visible");
  btn.disabled=false;btn.textContent="Réserver 10 min";
});
document.getElementById("btn-cancel-resa").addEventListener("click",()=>{selectedResa=null;document.getElementById("panel-resa").classList.remove("visible");render();});

function marquerSansAppli(id){
  saveState({...state,[id]:{status:"occupe",fin:null,resa:null,resaFin:null}});
}

async function saveState(next){
  state=next;render();
  try{await apiWrite(next);setConn("ok",new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));}
  catch{setConn("error");}
}

async function poll(){
  try{const data=await apiRead();state=data;render();setConn("ok",new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));}
  catch{setConn("error");}
}

document.getElementById("btn-reset").addEventListener("click",()=>{
  if(!confirm("Remettre toutes les bornes en disponible ?"))return;
  const next=Object.fromEntries(BORNES.map(id=>[id,{status:"libre",fin:null,resa:null,resaFin:null}]));
  saveState(next);
});

setInterval(render,30000);
render();poll();setInterval(poll,POLL);
</script>
</body>
</html>
